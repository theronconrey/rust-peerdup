# SPDX-License-Identifier: MIT
#
# Weekly pull requests for crate and GitHub Actions updates. Each one runs
# the Fedora workflow and a Packit Copr build, so a dependency bump that
# breaks the RPM (a new license, a new C library, a newer rustc than Fedora
# ships) shows up before it is merged.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # p2panda's crates move together; so do librqbit's.
      p2panda:
        patterns: ["p2panda-*"]
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # chacha20poly1305 0.10, crypto_box 0.9 and ed25519-dalek 2 take
      # rand_core 0.6 RNGs (rand 0.8). rand 0.9 doesn't satisfy their trait
      # bounds; move together with those crates' next majors.
      - dependency-name: rand
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
