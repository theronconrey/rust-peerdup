# SPDX-License-Identifier: MIT
#
# Checks every push and pull request inside Fedora: the code checks, then an
# RPM build from rust-peerdup.spec with vendored crates, rpmlint, and an
# install of the built package.

name: Fedora

on:
  push:
    branches: [main]
  pull_request:

env:
  # Link Fedora's SQLite, as the spec does, not libsqlite3-sys's bundled copy.
  LIBSQLITE3_SYS_USE_PKG_CONFIG: "1"

permissions:
  contents: read

jobs:
  fedora:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/${{ matrix.image }}
    continue-on-error: ${{ matrix.image == 'fedora:rawhide' }}
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "fedora:rawhide"]
    steps:
      - name: Install Fedora tooling
        run: >
          dnf -y install glibc-langpack-en git-core rpm-build rpmdevtools rpmlint
          cargo rust clippy rustfmt cargo-rpm-macros cargo-vendor-filterer xz
          systemd dbus-daemon

      - uses: actions/checkout@v7

      # The spec's BuildRequires (OpenSSL headers, the C toolchain the
      # crypto crates need) are what cargo needs too.
      - name: Install build dependencies
        run: dnf -y builddep rust-peerdup.spec

      # Fedora's Rust, not rustup's: this is the compiler the RPM is built with.
      - name: Code checks
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Spec and Cargo.toml agree on the version
        run: |
          spec=$(rpmspec -q --srpm --qf '%{version}' rust-peerdup.spec)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          echo "spec $spec, Cargo.toml $cargo"
          test "$spec" = "$cargo"

      # bash, for pipefail: rpmbuild's status must survive the pipe to tee.
      - name: Build the RPM
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rpmdev-setuptree
          packaging/vendor.sh "$HOME/rpmbuild/SOURCES"
          rpmbuild -ba rust-peerdup.spec 2>&1 | tee build.log

      # The License: tag must list the vendored crates' licenses. Print what
      # %cargo_license_summary found, so a Cargo.lock change that adds a
      # license shows up in review.
      - name: Licenses of the vendored crates
        run: |
          sed -n '/^# /p' build.log | sort -u
          rpm -qp --qf 'License: %{LICENSE}\n' "$HOME"/rpmbuild/SRPMS/rust-peerdup-*.src.rpm

      - name: rpmlint
        run: |
          rpmlint -r rust-peerdup.rpmlintrc rust-peerdup.spec \
            "$HOME"/rpmbuild/SRPMS/rust-peerdup-*.src.rpm \
            "$HOME"/rpmbuild/RPMS/*/rust-peerdup-*.rpm

      - name: Install and smoke-test the package
        run: |
          dnf -y install "$HOME"/rpmbuild/RPMS/*/rust-peerdup-[0-9]*.rpm
          # Two installed daemons sync a share over iroh-blobs.
          tests/e2e-sync.sh /usr/bin/rust-peerdup
          tests/e2e-revoke.sh /usr/bin/rust-peerdup
          # Per-share isolation and live revocation (A on a private bus).
          tests/e2e-isolation.sh /usr/bin/rust-peerdup
          # A member leaves on its own; the Owner rotates the key.
          tests/e2e-leave.sh /usr/bin/rust-peerdup
          # Linked against Fedora's SQLite, not a bundled copy.
          ldd /usr/bin/rust-peerdup | grep -q libsqlite3
          cd /
          rust-peerdup --version
          rust-peerdup --help
          rpm -ql rust-peerdup | grep -q "/man1/rust-peerdup.1"
          rpm -q --qf '%{LICENSE}\n' rust-peerdup
          rpm -q --provides rust-peerdup | grep -c 'bundled(crate('
          # Works with no daemon and no session bus: direct on-disk mode.
          rust-peerdup --data-dir /tmp/peer whoami
          mkdir -p /tmp/share
          rust-peerdup --data-dir /tmp/peer share-add --name ci --path /tmp/share --role sync
          # --topic is still accepted for --name; same name, different share.
          rust-peerdup --data-dir /tmp/peer share-add --topic ci --path /tmp/share2 --role sync
          test "$(rust-peerdup --data-dir /tmp/peer share-list | grep -c ' ci ')" = 2
          test "$(stat -c %a /tmp/peer/shares/*/share.json | sort -u)" = 600
          rust-peerdup --data-dir /tmp/peer share-list
          # The unencrypted roles are refused.
          if rust-peerdup --data-dir /tmp/peer share-add --name seed --path /tmp/share --role seed; then
            echo "seed role was accepted"; exit 1
          fi
          # --man=no: the container installs without documentation.
          systemd-analyze verify --man=no /usr/lib/systemd/user/rust-peerdup.service
          systemd-analyze security --offline=true --no-pager \
            /usr/lib/systemd/user/rust-peerdup.service || true

      - name: Keep the installed binary for the cross-network test
        if: matrix.image == 'fedora:latest'
        uses: actions/upload-artifact@v4
        with:
          name: rust-peerdup-rpm-binary
          path: /usr/bin/rust-peerdup
          retention-days: 3

  # The binary from the RPM, in two Fedora containers on two isolated
  # Docker networks: they can only meet through a relay or a hole-punched
  # path, as two homes on the internet do.
  cross-network:
    needs: fedora
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: rust-peerdup-rpm-binary
          path: bin
      - name: Two networks, one share (e2e)
        run: |
          chmod +x bin/rust-peerdup
          tests/e2e-xnet.sh bin/rust-peerdup
